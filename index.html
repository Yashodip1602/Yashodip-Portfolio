    <!-- Theme Initialization Script to prevent flash -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('yj_devops_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
